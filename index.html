<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>CronoMed</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <!-- Padrões dos compartimentos (cor + padrão, sem formas) -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
            <pattern id="cmp1" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
                <rect width="4" height="8" fill="#fff" opacity=".75" />
            </pattern>
            <pattern id="cmp2" width="7" height="7" patternUnits="userSpaceOnUse">
                <circle cx="3.5" cy="3.5" r="1.6" fill="#1A1A1A" opacity=".65" />
            </pattern>
            <pattern id="cmp3" width="8" height="7" patternUnits="userSpaceOnUse">
                <rect width="8" height="3" fill="#1A1A1A" opacity=".55" />
            </pattern>
            <pattern id="cmp4" width="10" height="10" patternUnits="userSpaceOnUse">
                <rect width="5" height="5" fill="#fff" opacity=".65" />
                <rect x="5" y="5" width="5" height="5" fill="#fff" opacity=".65" />
            </pattern>
            <pattern id="cmp5" width="7" height="8" patternUnits="userSpaceOnUse">
                <rect width="3" height="8" fill="#1A1A1A" opacity=".5" />
            </pattern>
            <pattern id="cmp6" width="10" height="8" patternUnits="userSpaceOnUse">
                <path d="M0 6 L2.5 2 L5 6 L7.5 2 L10 6" fill="none" stroke="#1A1A1A" stroke-width="1.6" opacity=".65" />
            </pattern>
        </defs>
    </svg>
    <a class="skip" href="#app">Pular para o conteúdo</a>
    <div id="notify" role="status" aria-live="polite"></div>
    <div id="app" tabindex="-1"></div>
    <div id="modal"></div>
    <div id="toasts" role="status" aria-live="polite"></div>
    <div id="sim"></div>
    <script src="js/store.js"></script>
    <script src="js/views.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
